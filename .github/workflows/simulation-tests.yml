name: Simulation Lab CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run simulation algorithm unit tests
        run: |
          python -m unittest discover -s tests -v

  execute-notebooks:
    name: Validate Notebook Executions
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute Lab 1 Notebook
        run: |
          cd Lab_1
          jupyter nbconvert --to notebook --execute 1.ipynb --stdout > /dev/null

      - name: Execute Lab 2 Notebook
        run: |
          cd Lab_2
          jupyter nbconvert --to notebook --execute lab2.ipynb --stdout > /dev/null

      - name: Execute Lab 3 Notebook
        run: |
          cd Lab_3
          jupyter nbconvert --to notebook --execute 3.ipynb --stdout > /dev/null

      - name: Execute Lab 4 Notebook
        run: |
          cd Lab_4
          jupyter nbconvert --to notebook --execute 4.ipynb --stdout > /dev/null
